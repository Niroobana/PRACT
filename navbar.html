<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Navbar Example</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        /* Navbar Layout Container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 1rem 2rem;
        }

        /* Brand Logo Style */
        .nav-logo a {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        /* Navigation Menu Links Wrapper */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        /* Individual Links Styling */
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 0.8rem;
            transition: background-color 0.3s, color 0.3s;
            border-radius: 4px;
        }

        /* Hover Interaction State */
        .nav-links a:hover {
            background-color: #555;
            color: #4CAF50;
        }
    </style>
</head>
<body>

    <!-- Semantic HTML Navigation Structure -->
    <nav class="navbar">
        <div class="nav-logo">
            <h1>hello</h1>
            <a href="#">BrandLogo</a>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
